# Helpers follow the selected family; legacy utilities must be installed first.
"pacman:libva-nvidia-driver" = { env = ["nvidia-current", "nvidia-legacy"] }
"pacman:nvidia-prime" = { env = ["nvidia-current", "nvidia-legacy"] }

# Legacy Maxwell/Pascal/Volta: establish AUR utilities in a separate first phase.
"aur:nvidia-580xx-utils" = { env = "nvidia-legacy-utils" }
"aur:nvidia-580xx-settings" = { env = "nvidia-legacy" }
"aur:opencl-nvidia-580xx" = { env = "nvidia-legacy" }
"aur:nvidia-580xx-dkms" = { env = "nvidia-legacy-dkms" }

# Current Turing+ userspace; module selection remains separate on derivatives.
"pacman:nvidia-utils" = { env = "nvidia-current" }
"pacman:nvidia-settings" = { env = "nvidia-current" }
"pacman:opencl-nvidia" = { env = "nvidia-current" }
"pacman:nvidia-open-dkms" = { env = "nvidia-open" }

# Goodix 27c6:5395 fingerprint reader
# The package script orders prerequisites/library/daemon; do not apply this
# group wholesale on a fresh stack, as fprintd can pull official libfprint first.
# The AUR recipe omits these build requirements; install them before building.
"pacman:glib2-devel" = { env = "fingerprint-goodix" }
"pacman:libgudev" = { env = "fingerprint-goodix" }
"pacman:fprintd" = { env = "fingerprint-goodix" }
"aur:libfprint-goodix53x5" = { env = "fingerprint-goodix" }

# Laptop utilities
"pacman:upower" = { env = "laptop" }
"pacman:powertop" = { env = "laptop" }

# Existing Limine/mkinitcpio installations
"aur:limine-mkinitcpio-hook" = { env = "limine-mkinitcpio" }
"pacman:sbctl" = { env = "limine-mkinitcpio" }

# Opt-in Snapper integration on supported Limine/mkinitcpio installations
"pacman:snapper" = { env = "snapper" }
"pacman:btrfs-assistant" = { env = "snapper" }
"pacman:btrfs-progs" = { env = "snapper" }
"pacman:inotify-tools" = { env = "snapper" }
"pacman:snap-pac" = { env = "snapper" }
"aur:limine-snapper-sync" = { env = "snapper" }
