[bootstrap.linux.firewall]
backend = "ufw"
state = "enabled"
default_incoming = "deny"
default_outgoing = "allow"
exclusive = false

[[bootstrap.linux.firewall.rules]]
name = "localsend-udp"
action = "allow"
protocol = "udp"
port = 53317

[[bootstrap.linux.firewall.rules]]
name = "localsend-tcp"
action = "allow"
protocol = "tcp"
port = 53317

[[bootstrap.linux.firewall.rules]]
name = "ssh"
action = "limit"
protocol = "tcp"
port = 22
