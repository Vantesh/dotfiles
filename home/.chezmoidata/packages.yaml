# Fixed package groups are owned by mise/conf.d/packages.toml.
# Kernel/header mappings and deferred legacy NVIDIA packages remain here.
packages:
  drivers:
    kernelHeaders:
      zen: linux-zen-headers
      lts: linux-lts-headers
      cachyos: linux-cachyos-headers
      default: linux-headers

    # Utilities remain first; the caller establishes this provider separately.
    nvidia580:
      - nvidia-580xx-utils
      - nvidia-580xx-settings
      - opencl-nvidia-580xx
