# Static Arch and AUR packages are owned by root mise.toml.
# Only runtime-dependent and boot-conditional groups remain here.
packages:
  drivers:
    base:
      - mesa-utils
      - libva-utils
      - vulkan-tools
      - vulkan-headers

    kernelHeaders:
      zen: linux-zen-headers
      lts: linux-lts-headers
      cachyos: linux-cachyos-headers
      default: linux-headers

    nvidia:
      - libva-nvidia-driver
      - nvidia-settings
      - nvidia-prime
      - opencl-nvidia

    amd:
      - xf86-video-amdgpu
      - vulkan-radeon
      - libva-mesa-driver
      - mesa-vdpau

    intel:
      - libva-intel-driver
      - intel-media-driver
      - vulkan-intel

  laptop:
    - power-profiles-daemon
    - upower
    - powertop

  limineMkinitcpio:
    - limine-mkinitcpio-hook
    - sbctl

  snapper:
    common:
      - snapper
      - btrfs-assistant
      - btrfs-progs
      - inotify-tools
      - snap-pac
    limine:
      - limine-snapper-sync
