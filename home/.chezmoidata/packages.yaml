packages:
  core:
    - uwsm
    - accountsservice
    - xdg-desktop-portal-gtk
    - xdg-autostart
    - gnome-keyring
    - networkmanager
    - udiskie
    - ntfs-3g
    - exfatprogs
    - dosfstools
    - mtools
    - f2fs-tools
    - reflector
    - wget
    - man-db
    - pkgfile
    - plocate
    - usbutils
    - ufw
    - kitty
    - imv
    - mpv
    - evince
    - nautilus
    - gvfs-mtp
    - libcanberra
    - ly
    - gparted
    - xorg-xhost
    - ddcutil
    - wl-clipboard
    - xdg-terminal-exec
    - gpu-screen-recorder
    - gpu-screen-recorder-ui
    - gpu-screen-recorder-notification

  compositor:
    hyprland:
      - hyprland
      - xdg-desktop-portal-hyprland
      - socat
      - cpio

  cli:
    - fastfetch
    - btop
    - starship
    - zoxide
    - fd
    - duf
    - eza
    - fzf
    - bat
    - ripgrep
    - curlie
    - shfmt
    - imagemagick
    - chafa
    - topgrade
    - yazi
    - unzip
    - neovim
    - git-delta
    - tree-sitter-cli

  theming:
    - nwg-look
    - adw-gtk-theme
    - apple_cursor
    - frameworkintegration
    - qtengine
    - tela-icon-theme
    - layer-shell-qt
    - qt6-multimedia
    - qt6-positioning
    - qt6-5compat
    - qt6-imageformats
    - kimageformats # enable video as wallpaper
  fonts:
    - apple-fonts
    - noto-fonts-cjk
    - noto-fonts-extra
    - ttf-liberation
    - inter-font

  optional:
    - rust
    - go
    - cava
    - brave-bin
    - visual-studio-code-bin
    - qbittorrent
    - spotify-launcher
    - spicetify-cli
    - localsend
    - vesktop-bin

  drivers:
    base:
      - mesa-utils
      - libva-utils
      - vulkan-tools
      - vulkan-headers

    kernelHeaders:
      zen: linux-zen-headers
      lts: linux-lts-headers
      cachyos: linux-cachyos-headers
      default: linux-headers

    nvidia:
      - libva-nvidia-driver
      - nvidia-settings
      - nvidia-prime
      - opencl-nvidia

    amd:
      - xf86-video-amdgpu
      - vulkan-radeon
      - libva-mesa-driver
      - mesa-vdpau

    intel:
      - libva-intel-driver
      - intel-media-driver
      - vulkan-intel

  laptop:
    - power-profiles-daemon
    - upower
    - powertop

  snapper:
    common:
      - snapper
      - btrfs-assistant
      - btrfs-progs
      - inotify-tools
      - snap-pac

    limine:
      mkinitcpio:
        - limine-mkinitcpio-hook
        - limine-snapper-sync
        - limine-entry-tool

      dracut:
        - limine-dracut-support
        - limine-snapper-sync

    grub:
      - grub-btrfs
      - snapper-rollback
