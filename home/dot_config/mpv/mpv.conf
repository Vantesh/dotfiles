# Video and rendering
hwdec=auto-safe
vo=gpu-next
video-sync=display-resample
interpolation=yes
scale=ewa_lanczossharp
dscale=mitchell
cscale=ewa_lanczossharp
gpu-shader-cache-dir=~/.cache/mpv/shaders

# ModernZ is the only OSC.
osc=no
osd-bar=no
border=no
cursor-autohide=300
osd-level=0
hr-seek=yes
osd-font=Verdana
osd-font-size=25
osd-outline-size=0.6
osd-blur=0.2

# Language and audio
alang=en,eng,english
slang=en,eng,english
audio-file-auto=fuzzy
volume-max=150
ao=pipewire
audio-channels=auto

# Subtitles without their own styling
sub-auto=all
demuxer-mkv-subtitle-preroll=yes
sub-font=Netflix Sans Medium
sub-font-size=30
sub-outline-size=2.0

# Screenshots
screenshot-format=png
screenshot-png-compression=1
screenshot-directory=~/Pictures/mpv-screenshots
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"

# Playback state; do not save ModernZ's temporary subtitle lift.
keep-open=yes
save-position-on-quit=yes
watch-later-options-remove=sub-pos
title=MPV - ${filename}

# Cache
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB
