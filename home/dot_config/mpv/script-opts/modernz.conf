# Only customizations; defaults belong to the pinned upstream script.
window_top_bar=no
showonpause=no
fadein=no
osc_on_start=no
# Native osc_on_seek=yes replaces seek.lua and respects visibility modes.
download_path=~/Videos/mpv Downloads/

# Keep the orange/brown palette and button effects.
chapter_title_font_size=14
seekbarfg_color=#FB8C00
seekbarbg_color=#94754F
seekbar_cache_color=#918F8E
hover_effect_color=#FB8C00
hover_effect=size,glow,color
nibbles_style=triangle
osc_fade_strength=130
slider_hover_size=115
thumbnail_box_padding=3
thumbnail_box_radius=3
tooltip_height_offset=2
portrait_window_trigger=1000
tick_delay=0.03

# Preserve screenshots with subtitles and left-menu/right-playlist actions.
screenshot_mbtn_left_command=osd-msg screenshot subtitles
playlist_mbtn_left_command=script-binding select/menu
playlist_mbtn_right_command=script-binding select/select-playlist
vol_ctrl_wheel_down_command=no-osd add volume -5
vol_ctrl_wheel_up_command=no-osd add volume 5
