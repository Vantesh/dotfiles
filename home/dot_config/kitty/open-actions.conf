# Use desktop defaults instead of executing files or opening terminal editors.
protocol file
action launch --type=background xdg-open $FILE_PATH

# SSH URLs need a terminal.
protocol ssh
action launch --type=os-window ssh $URL

# Let desktop defaults handle web links and application-specific URLs.
protocol http,https,magnet,spotify,obsidian,discord,zed
action launch --type=background xdg-open $URL
