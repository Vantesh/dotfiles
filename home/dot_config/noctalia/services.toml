[brightness]
enable_ddcutil = true

[calendar]
enabled = true

[idle]
pre_action_fade_seconds = 5

behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 1200.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
locked_timeout = 60.0
timeout = 1500.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 1800.0

[location]
auto_locate = true

[notification]
background_opacity = 0.85
follow_focused_output = true
layer = "overlay"
history_retention = 72

[osd]
position = "bottom_center"
background_opacity = 0.84999998100101948
follow_focused_output = true


[osd.kinds]
media = false