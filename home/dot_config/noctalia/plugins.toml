[plugins]
enabled = [
  "yuuto/arch-updater",
  "noctalia/screen_recorder",
  "noctalia/notes",
  "levi/warp",
  "vantesh/hyprbinds",
]

[plugin_settings."levi/warp"]
panel_layer = "overlay"
panel_placement = "floating"

[plugin_settings."yuuto/arch-updater"]
panel_placement = "floating"
terminal = 'xdg-terminal-exec --title=\"System Update\" --hold'
update_cmd = "~/.config/noctalia/scripts/updater.sh"
auto_check_hours = 3
show_changelog_after_update = false

[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"

[[plugins.source]]
name = "community"
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"

[[plugins.source]]
name = "Personal"
kind = "git"
location = "https://github.com/Vantesh/noctalia-plugins"
