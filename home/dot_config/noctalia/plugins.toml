[plugins]
enabled = [
  "yuuto/arch-updater",
  "noctalia/screen_recorder",
  "noctalia/notes",
  "levi/warp",
  "vantesh/hyprbinds",
  "vantesh/topgrade-updater"
]

[plugin_settings."levi/warp"]
panel_layer = "overlay"
panel_placement = "floating"


[plugin_settings."vantesh/topgrade-updater"]
panel_layer = "overlay"
panel_placement = "floating"
terminal_cmd = "xdg-terminal-exec --title=\"System Update\""


[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"

[[plugins.source]]
name = "community"
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"

[[plugins.source]]
name = "Personal"
kind = "git"
location = "https://github.com/Vantesh/noctalia-plugins"
