[metadata]
name = "zoxide"
description = "Browse zoxide directory history"
requirements = ["zoxide", "eza"]

[source]
shell = "fish"
command = "zoxide query -l | __tv_entries"
entry_delimiter = "\u0000"
display = '{split:\t:1..}'
output = '{split:\t:1..}'
no_sort = true
frecency = false

[preview]
shell = "fish"
command = 'eza --long --all --header --icons=always --color=always --group-directories-first -- {split:\t:0}'

[keybindings]
enter = "actions:cd"
ctrl-d = "actions:remove"

[actions.cd]
description = "Change to the selected directory"
shell = "fish"
separator = "\u0000"
command = "cd -- {split:\u0000:..|map:{split:\\t:0}|join: }; and fish"
mode = "execute"

[actions.remove]
description = "Remove the selected directory from zoxide"
shell = "fish"
separator = "\u0000"
command = "zoxide remove -- {split:\u0000:..|map:{split:\\t:0}|join: }"
mode = "fork"
