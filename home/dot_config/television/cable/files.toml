[metadata]
name = "files"
description = "A channel to select files and directories"
requirements = ["fd", "bat"]

[source]
command = [
  { name = "Default", run = "fd -t f" },
  { name = "Hidden",  run = "fd -t f -H" },
]

[preview]
command = "bat --paging=never -n --color=always '{}'"
env = { BAT_THEME = "ansi" }

[keybindings]
shortcut = "f1"
f12 = "actions:edit"
ctrl-up = "actions:goto_parent_dir"

[actions.edit]
description = "Opens the selected entries with the default editor (falls back to vim)"
command = "set -l editor vim; if set -q EDITOR; and test -n \"$EDITOR\"; set editor (string split ' ' -- $EDITOR); end; $editor '{}'"
shell = "fish"
# use `mode = "fork"` if you want to return to tv afterwards
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv files .."
mode = "execute"
