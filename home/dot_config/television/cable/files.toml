[metadata]
name = "files"
description = "A channel to select files and directories"
requirements = ["fd", "bat"]

[source]
shell = "fish"
command = [
  { name = "Default", run = "fd -t f -0 | __tv_entries --null" },
  { name = "Hidden",  run = "fd -t f -H -0 | __tv_entries --null" },
]
entry_delimiter = "\u0000"
display = '{split:\t:1..}'
output = '{split:\t:1..}'

[preview]
shell = "fish"
command = 'bat --paging=never -n --color=always -- {split:\t:0}'
env = { BAT_THEME = "ansi" }

[keybindings]
shortcut = "f1"
f12 = "actions:edit"
ctrl-up = "actions:goto_parent_dir"

[actions.edit]
description = "Opens the selected entries with the default editor (falls back to vim)"
# Complex placeholders bypass Television 0.15.9's additional simple-{} quoting.
command = "set -l editor vim; if set -q EDITOR; and test -n \"$EDITOR\"; set editor (string split ' ' -- $EDITOR); end; $editor -- {split:\u0000:..|map:{split:\\t:0}|join: }"
shell = "fish"
separator = "\u0000"
# use `mode = "fork"` if you want to return to tv afterwards
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv files .."
mode = "execute"
