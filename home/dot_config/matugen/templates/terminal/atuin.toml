# Material You dynamic theme for Atuin shell history generated by Matugen

[theme]
  name   = "matugen"
  parent = "default"

[colors]
  AlertInfo  = "#{{colors.primary.default.hex_stripped}}"
  AlertWarn  = "#{{colors.tertiary.default.hex_stripped}}"
  AlertError = "#{{colors.error.default.hex_stripped}}"
  Annotation = "#{{colors.on_surface_variant.default.hex_stripped}}"
  Base       = "#{{colors.on_surface.default.hex_stripped}}"
  Guidance   = "#{{colors.secondary.default.hex_stripped}}"
  Important  = "#{{colors.primary.default.hex_stripped}}"
  Title      = "#{{colors.primary.default.hex_stripped}}"
  Muted      = "#{{colors.outline.default.hex_stripped}}"
