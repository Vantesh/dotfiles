auto_sync = true
sync_frequency = "5m"
search_mode = "daemon-fuzzy"
filter_mode = "workspace"
filter_mode_shell_up_key_binding = "session"
workspaces = true
style = "auto"
inline_height = 25
show_preview = true
history_filter = [
  "^export .*(KEY|TOKEN|SECRET|PASSWORD|CREDENTIAL).*=",
  "^set .*(KEY|TOKEN|SECRET|PASSWORD|CREDENTIAL).*=",
  "^ls$",
  "^cd ",
  "--password",
  "^ssh-add",
  "^clear$",
  "^exit$",


]

show_help = false

enter_accept = true

## Score tuning for daemon-fuzzy: favor recent commands slightly
[search]
  filters                    = ["workspace", "directory", "session", "host", "global"]
  recency_score_multiplier   = 2.0
  frequency_score_multiplier = 1.0
  frecency_score_multiplier  = 1.5

[stats]
  common_subcommands = [
    "apt",
    "pacman",
    "cargo",
    "composer",
    "dnf",
    "docker",
    "git",
    "gh",
    "go",
    "ip",
    "kubectl",
    "npm",
    "pecl",
    "pnpm",
    "podman",
    "port",
    "systemctl",
    "tmux",
    "yarn",
  ]
  ignored_commands = ["dms", "cd", "ls", "reboot", "fasfetch", "vi", "echo"]

[keys]
  scroll_exits = false


[daemon]
  enabled        = true
  autostart      = true
  systemd_socket = true

[tmux]
  enabled = true

[ui]

[ai]
  enabled = true

[logs]
  enabled   = true
  dir       = "${XDG_DATA_HOME}/atuin/logs"
  level     = "info"
  retention = "2d"
