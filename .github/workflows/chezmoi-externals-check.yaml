name: Validate chezmoi externals

on:
  pull_request:
    branches: [main]
    paths:
      - "home/.chezmoiexternals/**"
      - ".github/workflows/chezmoi-externals-check.yaml"

permissions:
  contents: read

jobs:
  externals-check:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pacman -Syu --noconfirm chezmoi git

      - name: Validate externals templates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          templates=(home/.chezmoiexternals/*.tmpl)

          if (( ${#templates[@]} == 0 )); then
            echo "::error::No chezmoi externals templates found"
            exit 1
          fi

          failed=0

          for tmpl in "${templates[@]}"; do
            echo "Validating $tmpl"

            if ! output=$(chezmoi execute-template < "$tmpl"); then
              echo "::error file=$tmpl::Template rendering failed"
              failed=1
              continue
            fi

            if ! grep -Eq '^[[:space:]]*url:[[:space:]]*[^[:space:]]+' <<< "$output"; then
              echo "::error file=$tmpl::Missing or empty URL"
              failed=1
              continue
            fi

            echo "OK: $tmpl"
          done

          if (( failed != 0 )); then
            exit 1
          fi

          echo "All externals templates passed"
