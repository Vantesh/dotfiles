name: dotfiles CI

on:
  pull_request:
    branches: [main]
    paths:
      - "home/**"
      - "mise/**"
      - "ruff.toml"
      - "pyproject.toml"
      - ".github/tests/**"
      - ".github/workflows/ci-dots.yaml"

permissions:
  contents: read

env:
  NOCONFIRM: "1"
  OFFLINE: "1"

jobs:
  test-dotfiles:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install validation toolchain
        env:
          UV_TOOL_DIR: /opt/ci-tools
          UV_TOOL_BIN_DIR: /usr/local/bin
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            bash chezmoi diffutils git git-delta python python-loguru \
            python-pytest ruff shellcheck sudo util-linux uv atuin fish
          uv tool install --python /usr/bin/python3 --with pytest --with loguru pyrefly

          # Provisioning tests exercise regular-account guards, not a root login.
          useradd --create-home --user-group ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          install -d -o ci -g ci "$RUNNER_TEMP/dotfiles-ci/home"

      - name: Configure isolated home
        run: |
          set -euo pipefail

          readonly CI_HOME="$RUNNER_TEMP/dotfiles-ci/home"
          mkdir -p -- "$CI_HOME"

          printf '%s\n' \
            "HOME=$CI_HOME" \
            "XDG_CONFIG_HOME=$CI_HOME/.config" \
            "XDG_CACHE_HOME=$CI_HOME/.cache" \
            "XDG_DATA_HOME=$CI_HOME/.local/share" \
            "XDG_STATE_HOME=$CI_HOME/.local/state" >> "$GITHUB_ENV"

      - name: Test and lint setup scripts
        shell: runuser --user ci --preserve-environment -- bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null; then
            echo "Missing validation prerequisite: python3. Provide the tools separately." >&2
            exit 1
          fi
          python3 -B .github/tests/validate.py

      - name: Apply and verify dotfiles
        shell: runuser --user ci --preserve-environment -- bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          umask 022

          mkdir -p -- \
            "$XDG_CONFIG_HOME" \
            "$XDG_CACHE_HOME" \
            "$XDG_DATA_HOME" \
            "$XDG_STATE_HOME"

          chezmoi --verbose \
            --source "$GITHUB_WORKSPACE" \
            --destination "$HOME" \
            init --data=false --no-tty

          chezmoi --verbose \
            --source "$GITHUB_WORKSPACE" \
            --destination "$HOME" \
            apply --exclude=scripts --no-tty

          chezmoi --verbose \
            --source "$GITHUB_WORKSPACE" \
            --destination "$HOME" \
            verify --exclude=scripts --no-tty
