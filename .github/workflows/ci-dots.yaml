name: dotfiles CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NOCONFIRM: "1"
  SKIP_PACKAGES: "1"
  OFFLINE: "1"

jobs:
  test-dotfiles:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git bash shellcheck chezmoi diffutils python

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure isolated home
        run: |
          set -euo pipefail
          readonly CI_HOME="$RUNNER_TEMP/dotfiles-ci/home"
          mkdir -p -- "$CI_HOME"
          printf '%s\n' \
            "HOME=$CI_HOME" \
            "XDG_CONFIG_HOME=$CI_HOME/.config" \
            "XDG_CACHE_HOME=$CI_HOME/.cache" \
            "XDG_DATA_HOME=$CI_HOME/.local/share" \
            "XDG_STATE_HOME=$CI_HOME/.local/state" >> "$GITHUB_ENV"

      - name: Apply and verify dotfiles
        run: |
          set -euo pipefail
          umask 022
          mkdir -p -- "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"
          chezmoi --source "$GITHUB_WORKSPACE" --destination "$HOME" init --data=false --no-tty
          chezmoi --source "$GITHUB_WORKSPACE" --destination "$HOME" apply --exclude=scripts --no-tty
          chezmoi --source "$GITHUB_WORKSPACE" --destination "$HOME" verify --exclude=scripts --no-tty

      - name: ShellCheck scripts and libraries
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          source_dir="$(chezmoi --source "$GITHUB_WORKSPACE" source-path)"
          cd "$source_dir" || exit 1
          files=(.chezmoiscripts/**/*.sh .chezmoiscripts/**/*.sh.tmpl .chezmoitemplates/lib/**/*.sh)
          for file in "${files[@]}"; do
            printf 'Checking: %s\n' "$file" >&2
            if [[ "$file" = *.tmpl ]]; then
              chezmoi --source "$GITHUB_WORKSPACE" execute-template < "$file" | \
                shellcheck --severity=error -s bash -
            else
              shellcheck --severity=error -s bash "$file"
            fi
          done
