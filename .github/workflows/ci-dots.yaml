name: dotfiles CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-dotfiles:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git bash shellcheck chezmoi diffutils python

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure isolated home
        run: |
          set -euo pipefail
          readonly CI_HOME="$RUNNER_TEMP/dotfiles-ci/home"
          mkdir -p -- "$CI_HOME"
          printf '%s\n' \
            "HOME=$CI_HOME" \
            "XDG_CONFIG_HOME=$CI_HOME/.config" \
            "XDG_CACHE_HOME=$CI_HOME/.cache" \
            "XDG_DATA_HOME=$CI_HOME/.local/share" \
            "XDG_STATE_HOME=$CI_HOME/.local/state" >> "$GITHUB_ENV"

      - name: Test and lint setup scripts
        run: python3 -B -m unittest discover -s .github/tests -v && python3 -B .github/tests/validate.py
