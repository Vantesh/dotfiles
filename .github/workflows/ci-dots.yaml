name: dotfiles CI

on:
  pull_request:
    branches: [main]
    paths:
      - "home/**"
      - ".miserc.toml"
      - "mise/**"
      - "ruff.toml"
      - "pyproject.toml"
      - "renovate.json5"
      - ".github/tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  NOCONFIRM: "1"
  OFFLINE: "1"

jobs:
  test-dotfiles:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux@sha256:375a401bb3c6376b37f40b6dfa25067db37ec78d0b7af67ae6315f43a0184a9d
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation toolchain
        run: |
          set -euo pipefail
          # Mise installs all development tools and Python packages; system Python is
          # only a prerequisite for provisioning-style test fixtures.
          pacman -Syu --noconfirm --needed \
            bash chezmoi diffutils git git-delta mise nodejs npm python \
            sudo util-linux atuin fish
          # Pin Renovate so config validation and manager tests are reproducible.
          # Local tests read this version for the npx fallback.
          npm install --global --no-fund --no-audit renovate@45.0.2

          # Provisioning tests exercise regular-account guards, not a root login.
          useradd --create-home --user-group ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          install -d -o ci -g ci "$RUNNER_TEMP/dotfiles-ci/home"

      - name: Validate Renovate configuration
        run: |
          set -euo pipefail
          renovate-config-validator --strict --no-global renovate.json5

      - name: Configure isolated home
        run: |
          set -euo pipefail

          readonly CI_HOME="$RUNNER_TEMP/dotfiles-ci/home"
          mkdir -p -- "$CI_HOME"

          printf '%s\n' \
            "HOME=$CI_HOME" \
            "XDG_CONFIG_HOME=$CI_HOME/.config" \
            "XDG_CACHE_HOME=$CI_HOME/.cache" \
            "XDG_DATA_HOME=$CI_HOME/.local/share" \
            "XDG_STATE_HOME=$CI_HOME/.local/state" >> "$GITHUB_ENV"

      - name: Test and lint setup scripts
        shell: runuser --user ci --preserve-environment -- bash --noprofile --norc -e -o pipefail {0}
        env:
          MISE_CONFIG_DIR: /dev/null
          MISE_SYSTEM_CONFIG_DIR: /dev/null
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if ! command -v mise >/dev/null; then
            echo "Missing validation prerequisite: mise. Provide the tools separately." >&2
            exit 1
          fi
          mise run check
          git diff --exit-code

      - name: Apply and verify dotfiles
        shell: runuser --user ci --preserve-environment -- bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          umask 022

          mkdir -p -- \
            "$XDG_CONFIG_HOME" \
            "$XDG_CACHE_HOME" \
            "$XDG_DATA_HOME" \
            "$XDG_STATE_HOME"

          chezmoi --verbose \
            --source "$GITHUB_WORKSPACE" \
            --destination "$HOME" \
            init --data=false --no-tty

          chezmoi --verbose \
            --source "$GITHUB_WORKSPACE" \
            --destination "$HOME" \
            apply --exclude=scripts --no-tty

          chezmoi --verbose \
            --source "$GITHUB_WORKSPACE" \
            --destination "$HOME" \
            verify --exclude=scripts --no-tty
